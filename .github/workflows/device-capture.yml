name: Device Behavior Capture

on:
  pull_request:
    paths:
      - scripts/capture-device-behavior.sh
      - .github/workflows/device-capture.yml
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Capture duration in seconds
        required: false
        default: '120'
        type: number

permissions:
  contents: read

jobs:
  validate:
    name: Validate capture script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: bash -n scripts/capture-device-behavior.sh

      - name: Run ShellCheck
        run: |
          shellcheck scripts/capture-device-behavior.sh || true
          shellcheck --severity=error scripts/capture-device-behavior.sh

      - name: Run redaction self-test
        run: bash scripts/capture-device-behavior.sh --self-test

  emulator:
    name: Capture behavior on debug emulator
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=/dev/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x ./android/gradlew

      - name: Build Pulse Debug APK
        working-directory: ./android
        run: ./gradlew :app:assemblePulseDebug --no-daemon --stacktrace

      - name: Document capture scope
        run: |
          {
            echo '## Device capture scope'
            echo 'This manual emulator run captures app startup, scheduled-job state, role state, and the battery whitelist for the requested window.'
            echo 'It does not place real calls or tap Sync now.'
            echo 'The capture is redacted; CI keeps redaction enabled.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run capture on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          disable-animations: true
          working-directory: ./android
          script: |
            echo '=== Emulator ready ==='
            adb install -r app/build/outputs/apk/pulse/debug/app-pulse-debug.apk
            cd ..
            chmod +x scripts/capture-device-behavior.sh
            bash scripts/capture-device-behavior.sh -d "${{ inputs.duration_seconds }}" -i 15

      - name: Upload device capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-capture-${{ github.run_id }}
          path: captures/
          if-no-files-found: warn
          retention-days: 7

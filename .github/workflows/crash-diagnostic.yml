name: Crash Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crash-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout consumer-v1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: consumer-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Pulse Debug APK
        run: cd android && ./gradlew assemblePulseDebug --no-daemon

      - name: Run Emulator and Capture Diagnostic Logs
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          disable-animations: true
          script: |
            echo "=== Emulator ready ==="
            echo "=== Installing APK ==="

            adb install -r android/app/build/outputs/apk/pulse/debug/app-pulse-debug.apk

            chmod +x scripts/verify-launch-and-capture.sh

            # DO NOT "fix" this back to com.signalgate.multipoint.MainActivity.
            #
            # applicationId:
            #   com.signalgate.multipoint.pulse
            #
            # Activity class:
            #   com.signalgate.pulse.MainActivity
            #
            # The applicationId is deliberately retained for the Pulse flavor.
            # The Activity class uses the post-rename com.signalgate.pulse namespace.
            scripts/verify-launch-and-capture.sh com.signalgate.multipoint.pulse/com.signalgate.pulse.MainActivity com.signalgate.multipoint.pulse "$GITHUB_WORKSPACE"

      - name: Upload Full Logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-logcat
          path: full_logcat.txt
          retention-days: 7

      - name: Upload SignalGate Diagnostic Logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signalgate-diagnostic-logcat
          path: signalgate_diagnostic_logcat.txt
          retention-days: 7

  crash-diagnostic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout consumer-v1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: consumer-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      # Same signing setup as pulse-ci.yml's build-release job. If the four
      # RELEASE_* secrets aren't configured in this repo yet, this step fails
      # here with a clear Gradle signing error rather than silently producing
      # an unusable APK — see signing-config-fail-closed (Chunk 4).
      - name: Check release signing secrets are configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets not configured in this repo:$missing"
            exit 1
          fi
          echo "All four release signing secrets are present."

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build Pulse Release APK
        working-directory: ./android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assemblePulseRelease --no-daemon --stacktrace

      - name: Run Emulator and Capture Diagnostic Logs
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          disable-animations: true
          script: |
            echo "=== Emulator ready ==="
            echo "=== Installing APK ==="

            adb install -r android/app/build/outputs/apk/pulse/release/app-pulse-release.apk

            chmod +x scripts/verify-launch-and-capture.sh

            # Same applicationId as the debug build (no applicationIdSuffix on
            # either buildType) -- see the note in the debug job above for why
            # the explicit Activity class name is required here.
            scripts/verify-launch-and-capture.sh com.signalgate.multipoint.pulse/com.signalgate.pulse.MainActivity com.signalgate.multipoint.pulse "$GITHUB_WORKSPACE"

      - name: Upload Full Logcat (Release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-logcat-release
          path: full_logcat.txt
          retention-days: 7

      - name: Upload SignalGate Diagnostic Logcat (Release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signalgate-diagnostic-logcat-release
          path: signalgate_diagnostic_logcat.txt
          retention-days: 7

name: Pulse Consumer CI

on:
  push:
    branches: [ consumer-v1 ]
  pull_request:
    branches: [ consumer-v1 ]

jobs:
  build-and-test:
    name: Pulse Debug — Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Architecture Drift Detection
        run: |
          chmod +x ./scripts/check-architecture-drift.sh
          ./scripts/check-architecture-drift.sh

      - name: Build Pulse Debug APK
        working-directory: ./android
        run: ./gradlew :app:assemblePulseDebug --stacktrace --parallel

      - name: Run Unit Tests (Pulse)
        working-directory: ./android
        run: ./gradlew :app:testPulseDebugUnitTest --stacktrace

      - name: Run Lint Check (Pulse)
        working-directory: ./android
        run: ./gradlew :app:lintPulseDebug --stacktrace

      - name: Upload Pulse Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: android/app/build/outputs/apk/pulse/debug/app-pulse-debug.apk
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android/app/build/test-results/
            android/app/build/reports/
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-pulseDebug.html
          retention-days: 7

      - name: Verify build.gradle compose-metrics gate
        run: |
          if ! grep -q 'project.hasProperty("composeCompilerReports")' android/app/build.gradle; then
            echo "::error::compose-metrics gating reverted in app/build.gradle"
            exit 1
          fi

  instrumented-tests:
    name: Pulse — Instrumented Tests (MigrationTest, Koin)
    runs-on: ubuntu-latest
    # Only run on push to consumer-v1, not on every PR — emulator jobs are slow.
    # Remove this condition once the test suite is mature enough to gate PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/consumer-v1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          disable-animations: true
          script: |
            echo "=== Emulator ready ==="
            adb logcat -c
            echo "=== Running instrumented tests ==="
            cd android
            ./gradlew :app:connectedPulseDebugAndroidTest --stacktrace 2>&1 | tee /tmp/instrumented_test_output.txt
            TEST_EXIT=${PIPESTATUS[0]}
            echo "=== Test output tail ==="
            tail -50 /tmp/instrumented_test_output.txt
            exit $TEST_EXIT

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14

name: Pulse Consumer CI

on:
  push:
    branches: [ consumer-v1 ]
  pull_request:
    branches: [ consumer-v1 ]

jobs:
  build-and-test:
    name: Pulse Debug — Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Architecture Drift
        run: |
          chmod +x ./scripts/check-architecture-drift.sh
          ./scripts/check-architecture-drift.sh

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Pulse Debug APK
        working-directory: ./android
        run: ./gradlew :app:assemblePulseDebug --stacktrace --parallel

      - name: Run Unit Tests (Pulse)
        working-directory: ./android
        run: ./gradlew :app:testPulseDebugUnitTest --stacktrace

      - name: Run Lint Check (Pulse)
        working-directory: ./android
        run: ./gradlew :app:lintPulseDebug --stacktrace

      - name: List build outputs
        if: always()
        run: find android/app/build -maxdepth 5 -type f | sort

      - name: Upload Pulse Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: android/app/build/outputs/apk/**/app-*.apk
          retention-days: 7

      # Temporary Phase 3.4 migration evidence: the sandbox cannot run KSP
      # without an Android SDK, so retain the generated Room schema artifact
      # until schemas/.../4.json is committed to the branch.
      - name: Upload Generated Room Schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: android/app/schemas/**
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android/app/build/test-results/**
            android/app/build/reports/**
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/**
          retention-days: 7

      - name: Verify build.gradle compose-metrics gate
        run: |
          if ! grep -q 'project.hasProperty("composeCompilerReports")' android/app/build.gradle; then
            echo "::error::compose-metrics gating reverted in app/build.gradle"
            exit 1
          fi

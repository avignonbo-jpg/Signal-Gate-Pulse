name: Generate Room Schema

on:
  workflow_dispatch:

jobs:
  generate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Room schema
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:kspPulseDebugKotlin --stacktrace

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: android/app/schemas

      - name: Find Room schemas
        run: |
          find . -path "*schemas*" -type f -name "*.json" -print

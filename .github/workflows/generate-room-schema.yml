name: Generate Room Schema 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify checked out database source
        run: |
          echo "=== Repository Information ==="
          pwd
          git branch --show-current
          git rev-parse HEAD

          echo "=== SignalGateDatabase.kt version check ==="
          grep -n "version =" android/app/src/main/java/com/signalgate/pulse/database/SignalGateDatabase.kt

          echo "=== PendingCardEntity check ==="
          grep -n "PendingCardEntity" android/app/src/main/java/com/signalgate/pulse/database/SignalGateDatabase.kt

      - name: Generate Room schema
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean :app:kspPulseDebugKotlin --stacktrace

      - name: Find Room schemas
        run: |
          echo "=== Room schema files ==="
          find android/app/schemas -type f -name "*.json" -print || true

          echo "=== Schema directories ==="
          find android/app/schemas -type d -print || true

      - name: Upload Room schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-schema
          path: android/app/schemas

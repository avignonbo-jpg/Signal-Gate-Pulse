apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace "com.signalgate.pulse"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.signalgate.multipoint"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true

        // Was missing entirely — AGP silently fell back to the legacy
        // android.test.InstrumentationTestRunner (JUnit3-era), which cannot
        // discover @RunWith(AndroidJUnit4::class)/@Test JUnit4 methods at
        // all. Every instrumented test in this project (Bloom, migration,
        // source-deletion-cascade, Keystore, startup-timing) uses JUnit4 —
        // without this line, connectedPulseDebugAndroidTest runs, finds
        // nothing recognizable, and reports "OK (0 tests)" — a clean exit
        // that looks like success but tested nothing. Confirmed root cause
        // 2026-08-15 from a real CI run's utp.0.log
        // (test_runner_class: "android.test.InstrumentationTestRunner").
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // PULSE-LOCKED (do not revert without explicit owner sign-off — see CODEOWNERS):
    // Compose compiler metrics/reports must stay gated behind the -P properties below.
    // Ungating this causes every build (debug, release, CI) to generate compose_metrics
    // output unconditionally, slowing builds with no benefit outside metrics.yml's
    // explicit `-PcomposeCompilerReports=true -PcomposeCompilerMetrics=true` runs.
    // This exact gate was reverted once already (see error_corrections.md) — if you
    // are editing this block, confirm with the project owner first.
    kotlinOptions {
        jvmTarget = "17"
        if (project.hasProperty("composeCompilerReports") || project.hasProperty("composeCompilerMetrics")) {
            freeCompilerArgs += [
                "-P", "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=${project.buildDir}/compose_metrics",
                "-P", "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=${project.buildDir}/compose_metrics"
            ]
        }
    }

    // Security fix: the release build type was previously signed with
    // signingConfigs.debug — the AGP-provided shared debug keystore, never
    // meant to sign anything distributed to users. This reads real release
    // credentials from environment variables so they can be injected as CI
    // secrets and never committed to the repo. Generate an actual release
    // keystore out-of-band (e.g. `keytool -genkeypair ...`) and store it in
    // your CI secret manager — this config does not create one for you.
    // If the env vars are unset, this intentionally fails the release build
    // loudly rather than silently falling back to debug signing.
    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'RemoveWorkManagerInitializer'
        abortOnError true
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    flavorDimensions "version"

    productFlavors {
        pulse {
            dimension "version"
            applicationId "com.signalgate.multipoint.pulse"
        }
    }

    ksp {
        arg("room.incremental", "true")
        // Required for MigrationTestHelper — SignalGateDatabase exports schema versions 1–3.
        // Schema files written here should be committed to version control.
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    // Phase 2.6: expose Room schema JSON files to androidTest so MigrationTestHelper
    // can load them at test time. Must match the schemaLocation path in ksp{} above.
    // Without this block, MigrationTest.kt fails at runtime:
    //   "Cannot find schema file for version X of SignalGateDatabase."
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

dependencies {

    // koin_version declared once — the duplicate in the Koin test section below
    // was removed. Two declarations of the same Groovy variable in one dependencies{}
    // block causes a "variable already defined" build failure.
    def koin_version = "3.5.6"

    // Koin
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-compose:$koin_version"
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Core
    implementation 'androidx.core:core-ktx:1.13.1' //noinspection GradleDependency — pinned, verified against minSdk 29 target
    implementation 'androidx.appcompat:appcompat:1.7.0' //noinspection GradleDependency — pinned, verified against minSdk 29 target
    implementation 'com.google.android.material:material:1.12.0' //noinspection GradleDependency — pinned, verified against minSdk 29 target

    // Splash Screen — official AndroidX SplashScreen API compat library. Covers the
    // window shown while MainApplication.onCreate()'s runBlocking DB init is running
    // (see MainApplication class doc — that block is intentional and must not be
    // removed; this only makes the wait visibly branded instead of a blank/dark screen).
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // HTTP Client for Reliable Sources
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Timber — structured logging (Step 1.13).
    // Tree planted in MainApplication.onCreate() before any module is resolved.
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version" //noinspection GradleDependency — pinned to match sqlcipher-android 4.5.5 compatibility
    implementation "androidx.room:room-ktx:$room_version" //noinspection GradleDependency — pinned to match sqlcipher-android 4.5.5 compatibility
    ksp "androidx.room:room-compiler:$room_version"
    implementation "net.zetetic:sqlcipher-android:4.5.5"
    implementation "androidx.sqlite:sqlite:2.4.0" //noinspection GradleDependency — pinned, matched to Room 2.6.1

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00') //noinspection GradleDependency — pinned BOM, upgrade tracked separately
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.1' //noinspection GradleDependency — pinned to match compose-bom 2024.09.00
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4' //noinspection GradleDependency — pinned to match compose-bom 2024.09.00

    // Phase 1.3 — Compose UI proof that persisted review cards reach DigestScreen.
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // WorkManager
    def work_version = "2.9.1"
    implementation "androidx.work:work-runtime-ktx:$work_version" //noinspection GradleDependency — pinned, verified against minSdk 29 target

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7' //noinspection GradleDependency — pinned, upgrade tracked separately
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7' //noinspection GradleDependency — pinned, upgrade tracked separately
    implementation 'androidx.navigation:navigation-compose:2.7.7' //noinspection GradleDependency — pinned, upgrade tracked separately

    // Unit tests (JVM — no device required)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.3.1'

    // Koin test — checkModules() DI graph verification (KoinModuleTest.kt)
    testImplementation "io.insert-koin:koin-test:$koin_version"
    testImplementation "io.insert-koin:koin-test-junit4:$koin_version"
    testImplementation "io.insert-koin:koin-android-test:$koin_version"

    // Room in-memory database for KoinModuleTest (seeded by DatabaseInitializer)
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation 'androidx.test:core:1.5.0' //noinspection GradleDependency — pinned to match androidTest suite versions below

    // Instrumented tests (androidTest — requires device or emulator)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5' //noinspection GradleDependency — pinned, matched to androidx.test:core 1.5.0
    androidTestImplementation 'androidx.test:core:1.5.0' //noinspection GradleDependency — pinned; explicit for ActivityScenario (StartupTimingTest), previously only a transitive dep
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1' //noinspection GradleDependency — pinned, matched to androidx.test:core 1.5.0
    androidTestImplementation 'androidx.test:runner:1.5.2' //noinspection GradleDependency — pinned, matched to androidx.test:core 1.5.0
    androidTestImplementation 'androidx.test:rules:1.5.0' //noinspection GradleDependency — pinned, matched to androidx.test:core 1.5.0

    // Room MigrationTestHelper — validates MIGRATION_1_2 and MIGRATION_2_3 schemas against entity definitions.
    // Requires exportSchema = true in @Database (already set) and the
    // sourceSets.androidTest.assets.srcDirs declaration in android{} above.
    androidTestImplementation "androidx.room:room-testing:$room_version"

    // Robolectric — gives Room a working SQLite shadow on plain JVM unit tests
    testImplementation 'org.robolectric:robolectric:4.13'
}
